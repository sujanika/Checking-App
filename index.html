<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNM College Maliankara – ISO Check List</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f4c5c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1c2b2d;--mute:#5f6f72;--line:#d9dfdd;--brand:#0f4c5c;--ok:#2e7d32;--okbg:#e3f2e4;--no:#b3261e;--nobg:#fbe3e1;--na:#6b7280;--nabg:#e8eaed}
@media (prefers-color-scheme:dark){:root{--bg:#121819;--card:#1b2426;--ink:#e6eeee;--mute:#9db0b2;--line:#2f3d3f;--brand:#6fc3d4;--ok:#7bd88a;--okbg:#1e3a22;--no:#ff8a80;--nobg:#4a1f1c;--na:#b0b7c0;--nabg:#2d3338}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
@media (prefers-color-scheme:dark){header{color:#0b1b1e}}
header h1{font:700 18px/1.2 Georgia,"Times New Roman",serif;margin:0;flex:1}
header button{background:transparent;border:0;color:inherit;font-size:22px;padding:4px 8px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.big{font:700 34px/1 Georgia,serif}
.mute{color:var(--mute);font-size:14px}
.dept{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.dept .row{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:600}
label.f{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input[type=text],input[type=date],textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item p{margin:0 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;font:600 15px inherit;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;cursor:pointer}
.seg button.y{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.seg button.n{background:var(--nobg);border-color:var(--no);color:var(--no)}
.seg button.na{background:var(--nabg);border-color:var(--na);color:var(--na)}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:600 15px inherit;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#0b1b1e}}
.btn.alt{background:transparent;color:var(--brand)}
.btn.warn{background:transparent;color:var(--no);border-color:var(--no)}
.menu button,.menu label{display:block;width:100%;margin-bottom:8px;text-align:center;line-height:44px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;min-height:44px;border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:8px;font:600 15px inherit;cursor:pointer}.tabs button.on{background:var(--brand);color:#fff}@media (prefers-color-scheme:dark){.tabs button.on{color:#0b1b1e}}
.note{margin-top:8px}.note label{font-size:13px;font-weight:600;color:var(--no)}.addn{background:none;border:0;color:var(--brand);font:600 14px inherit;padding:10px 0 0;cursor:pointer}.pi{padding:10px 0;border-top:1px solid var(--line)}.pi:first-of-type{border-top:0}.pi small{display:block;color:var(--mute)}.pi button{all:unset;cursor:pointer;display:block;width:100%}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px;margin-top:12px;border-top:1px solid var(--line)}.savebar .btn{width:100%}.savebar small{display:block;text-align:center;color:var(--mute);margin-top:6px}.dl{margin-top:10px;width:100%}.meter{margin-bottom:12px;font-size:14px;color:var(--mute)}
.grp summary{cursor:pointer;padding:4px 0;font-size:16px}.grp[open] summary{margin-bottom:4px}.grp{padding:10px 14px}
.ref{font-size:12px;color:var(--mute);font-weight:600}.info{font-size:13px;color:var(--mute);margin:-4px 0 8px}.seg button{font-size:13px;padding:0 2px}.seg button.hc.on{background:#e3effa;border-color:#1565c0;color:#1565c0}@media (prefers-color-scheme:dark){.seg button.hc.on{background:#17304a;border-color:#6fb1ee;color:#6fb1ee}}
.smp{margin-top:8px}.seg button.au.on{background:#ece6fb;border-color:#5b3fc4;color:#5b3fc4}@media (prefers-color-scheme:dark){.seg button.au.on{background:#2a2147;border-color:#a894f0;color:#a894f0}}select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);flex:1;min-width:0}.seg button.oi{background:#fff3d6;border-color:#c77d00;color:#9a6200}.obk{padding:12px 0;border-top:1px solid var(--line)}.obk:first-of-type{border-top:0}
.back{background:none;border:0;color:var(--brand);font:600 15px inherit;padding:8px 0;cursor:pointer}
.banner{background:var(--nobg);color:var(--no);padding:10px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:9}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<header><h1 id="title">SNM College Maliankara – ISO Check List</h1><button id="menuBtn" aria-label="Menu">⋮</button></header>
<div id="banner"></div>
<main id="app"></main>
<script>
const DEPTS=["English","Botany","Chemistry","Physics","Zoology","Mathematics","Statistics","Malayalam","Hindi","Economics","Commerce (Regular)","BCom Co-operation","BCom Logistics and Management","BCom Financial Markets","BCom Finance and Taxation","BBA","Library","Physical Education","Zoology – PG"];
const RAW=[["SNMC/MR/R/01-01", "Outreach programs reports", "Soft copy", "Programs done outside the campus for society"], ["SNMC/MR/R/01-02", "Stock Register", "Hard copy", "Issue of items updated"], ["SNMC/MR/R/01-03", "MoU's and Collaboration Agreement", "", "Update Excel file and upload the supporting file in the folder"], ["SNMC/MR/R/02-01", "Student Placement and Progression records", "Soft copy", "Update Excel file and upload the supporting file in the folder"], ["SNMC/MR/R/02-02", "Self-Appraisal of Teaching and Non-teaching Staffs", "Soft copy", ""], ["SNMC/MR/R/04-04", "Department Time table and Lab time table", "Soft copy", ""], ["SNMC/MR/R/04-05", "Syllabus and Lab Syllabus", "Soft copy", ""], ["SNMC/MR/R/04-06", "Curriculum for Bridge Courses, Evaluation and Report", "Soft copy", ""], ["SNMC/MR/R/04-06-A", "Advanced Learner Report", "Soft copy", ""], ["SNMC/MR/R/04-07", "Lesson Plan", "Soft copy (deleting)", ""], ["SNMC/MR/R/04-07-A", "Lab attendance register", "Hard copy", ""], ["SNMC/MR/R/04-08", "CO, PO mapping given for FYUGP", "Soft copy", ""], ["SNMC/MR/R/04-09", "Departmental action plan", "Soft copy", ""], ["SNMC/MR/R/04-09-A", "Department Annual Report (add previous year academic report)", "Soft copy", ""], ["SNMC/MR/R/04-10", "Mentoring register", "Soft copy", ""], ["SNMC/MR/R/04-11", "Remedial Register and Report", "Soft copy", ""], ["SNMC/MR/R/04-12", "Individual time table", "Soft copy", ""], ["SNMC/MR/R/04-12-A", "Syllabus division", "Soft copy", ""], ["SNMC/MR/R/04-13", "Teacher's diary", "Soft copy", ""], ["SNMC/MR/R/04-14", "Examinations register", "Hard copy", ""], ["SNMC/MR/R/04-14-A", "Lab Exam Register", "Hard copy", ""], ["SNMC/MR/R/04-20", "Internal Exam Timetable", "Soft copy", ""], ["SNMC/MR/R/04-20-A", "Internal Exam Question Paper and Answer Sheet (3 Samples)", "Hard copy + Soft copy", ""], ["SNMC/MR/R/04-20-B", "A, B, C and D Form", "Hard copy", ""], ["SNMC/MR/R/04-21", "Students Feedback and Action taken Report", "Soft copy", ""], ["SNMC/MR/R/04-21-A", "Grievance Register", "Hard copy", ""], ["SNMC/MR/R/04-22", "PTA Meeting Register", "Hard copy", ""], ["SNMC/MR/R/04-23", "Result Analysis", "Soft copy", ""], ["SNMC/MR/R/04-23-A", "Certificate course – Syllabus, Register and Report", "Hard copy + Soft copy", ""], ["SNMC/MR/R/04-24-A", "Extension program", "Soft copy", "Programs done for society within the campus"], ["SNMC/MR/R/04-26", "Student Project – 3 Samples", "Hard copy", ""], ["SNMC/MR/R/04-26-A", "Project Bonafide certificate of all students", "PDF", ""], ["SNMC/MR/R/08-01", "Achievement in Sports", "", "Update Excel and add supporting file in the folder"], ["SNMC/MR/R/08-02", "Achievement in Co-curricular events", "", "Update Excel and add supporting file in the folder"], ["SNMC/MR/R/13-01", "Lab manuals", "Soft copy", ""], ["SNMC/MR/R/13-02", "Equipment Details", "Soft copy", ""], ["SNMC/MR/R/15-01", "List of classrooms and facilities", "Soft copy", ""], ["SNMC/MR/R/15-03", "Department Library Register", "Hard copy", ""], ["SNMC/MR/R/19-01", "Participation Certificates of faculties", "", "Update Excel and upload supporting documents in the folder"], ["SNMC/MR/R/19-02", "Workshop, conference, seminar brochures", "", "Update Excel and upload supporting documents in the folder"], ["SNMC/MR/R/20-01", "Publication details", "", "Update Excel and upload supporting documents in the folder"], ["SNMC/MR/R/20-02", "Paper presentation and Conference details", "", "Update Excel and upload supporting documents in the folder"], ["SNMC/MR/R/20-03", "Awards and Grants Received", "", "Update Excel and upload supporting documents in the folder"], ["SNMC/MR/R/20-04", "Consultancy", "Hard copy", "Add report if consultancy present"], ["SNMC/MR/R/20-05", "Competency Matrix", "", "Excel file will be shared through link (later)"], ["SNMC/MR/R/23-03", "Department Meeting Minutes", "Hard copy", ""], ["SNMC/MR/R/24-03", "Student enrolment list", "", "Update the Excel"], ["SNMC/MR/R/27-01", "Website", "", "To be updated"], ["SNMC/MR/R/28-01", "Agreements and Quotations", "", "If applicable"], ["SNMC/MR/R/28-02", "List of Suppliers", "", "If applicable"], ["SNMC/MR/R/28-03", "List of Service Providers", "", "If applicable"], ["SNMC/MR/R/30-01", "Student Profile", "Hard copy", ""]];
const ITEMS=RAW.map(r=>r[1]),REF=RAW.map(r=>r[0]),FMT=RAW.map(r=>r[2]),DET=RAW.map(r=>r[3]);
const KEY="snmcIso.v1";
let S={app:"snmc",meta:{year:"",date:"",auditor:""},d:{},hc:{},smp:{},ob:{},os:{},osi:{},aud:{},rem:{},note:{},year:"2026-27",years:{}};let hv="dept",opened={};
let storageOK=true,view="home",cur=0;
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){storageOK=false}
function save(){try{S.saved=Date.now();localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false;banner()}return storageOK}
function savedTxt(){return S.saved?"Last saved at "+new Date(S.saved).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Not saved yet"}
function download(name,text,type){const u=URL.createObjectURL(text instanceof Blob?text:new Blob([text],{type:type||"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},5000)}
function deptReport(d){const s=stats(d);const today=new Date().toISOString().slice(0,10);
 let t=`SNM COLLEGE MALIANKARA – ISO CHECK LIST\nPENDING REPORT – ${DEPTS[d]}\nAcademic year: ${S.year}   Audit date: ${S.meta.date||today}   Auditor: ${S.meta.auditor||"-"}\n${s.y} of ${s.t} documents ready, ${s.pend} pending, ${s.hc} with hard copy\n`;
 const pend=ITEMS.map((x,i)=>[x,i]).filter(([x,i])=>st(d,i)==="n"),un=ITEMS.map((x,i)=>[x,i]).filter(([x,i])=>!st(d,i));
 t+="\nPENDING\n"+(pend.length?pend.map(([x,i],k)=>`${k+1}. ${REF[i]} – ${x}${hcv(d,i)?" [Hard copy]":""}${nt(d,i)?"\n   Pending: "+nt(d,i):""}`).join("\n"):"None")+"\n";
 if(un.length)t+="\nNOT CHECKED YET\n"+un.map(([x,i],k)=>`${k+1}. ${REF[i]} – ${x}`).join("\n")+"\n";
 if(S.rem[d])t+="\nREMARKS\n"+S.rem[d]+"\n";
 return t}
function dlDept(d){download("Pending-"+DEPTS[d].replace(/[^A-Za-z0-9]+/g,"-")+"-"+new Date().toISOString().slice(0,10)+".txt",deptReport(d));toast("Report downloaded")}
function banner(){document.getElementById("banner").innerHTML=storageOK?"":'<div class="banner">This browser is not saving data. Open this file in Chrome or Safari, and use Menu → Back up data to keep your work.</div>'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nt(d,i){return ((S.note[d]||{})[i])||""}
const OBS=[["Teaching Process","Department Timetable -","SNMC/MR/R/04-04","SNMC/MR/R/04-04"],["Teaching Process","Lesson Plan:","SNMC/MR/R/04 – 07","SNMC/MR/R/04-07"],["Teaching Process","Curriculum for Bridge Course, Evaluation and Report:","SNMC/MR/R/04-06","SNMC/MR/R/04-06"],["Teaching Process","Action Plan:","SNMC/MR/R/04-09","SNMC/MR/R/04-09"],["Workload Distribution","Syllabus division :","SNMC/MR/R/04 – 12- A","SNMC/MR/R/04-12-A"],["Workload Distribution","Teacher’s Diary:","SNMC/MR/R/04-13","SNMC/MR/R/04-13"],["Student Progression","Result Analysis:","SNMC/MR/R/04-23","SNMC/MR/R/04-23"],["Student Progression","Project Bonafied certificate:","SNMC/MR/R/04 - 26- A","SNMC/MR/R/04-26-A"],["Continuous evaluation","PTA Meeting  Register:","SNMC/MR/R/04-22","SNMC/MR/R/04-22"],["Competence","Participation Certificates of faculties :","SNMC/MR/R/19-01","SNMC/MR/R/19-01"]];
const OBSI=OBS.map(o=>REF.indexOf(o[3]));
const FIELDS=["d","hc","smp","ob","osi","rem","note","aud","meta"];
(function(){if(S.os&&!S.osMig){Object.keys(S.os).forEach(d=>{S.osi[d]=S.osi[d]||{};Object.keys(S.os[d]).forEach(k=>{if(OBSI[k]>=0&&S.os[d][k])S.osi[d][OBSI[k]]=S.os[d][k]})});S.osMig=1}})();
function audOn(d,i){const a=(S.aud[d]||{})[i];return a===undefined?OBSI.includes(i):!!a}
function audList(d){const pos=i=>{const k=OBSI.indexOf(i);return k<0?100+i:k};return ITEMS.map((_,i)=>i).filter(i=>audOn(d,i)).sort((a,b)=>pos(a)-pos(b))}
function osvI(d,i){const o=(S.osi[d]||{})[i];if(o)return o;const v=st(d,i);return v==="y"?"O+":v==="n"?"OI":""}
function tpl(i){const k=OBSI.indexOf(i);return k>=0?{h:"Procedure for Academics: "+OBS[k][0],l:OBS[k][1],r:OBS[k][2]}:{h:"",l:ITEMS[i]+":",r:REF[i]}}
function yearList(){return [S.year,...Object.keys(S.years)].sort()}
function nextYear(y){const m=/^(\d{4})-(\d{2})$/.exec(y);return m?(+m[1]+1)+"-"+String((+m[2]+1)%100).padStart(2,"0"):""}
function switchYear(y,aud){if(y===S.year)return;const snap={};FIELDS.forEach(f=>snap[f]=S[f]);S.years[S.year]=snap;
 const b=S.years[y]||{meta:{date:"",auditor:S.meta.auditor||"",year:""},d:{},hc:{},smp:{},ob:{},osi:{},rem:{},note:{},aud:aud||{}};
 FIELDS.forEach(f=>S[f]=b[f]||(f==="meta"?{date:"",auditor:"",year:""}:{}));delete S.years[y];S.year=y;save();view="home";hv="dept";render();scrollTo(0,0)}
function modal(html,wire){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px";o.innerHTML=`<div class="card" style="width:100%;max-width:420px;margin:0">${html}</div>`;document.body.appendChild(o);wire(o,()=>o.remove())}
function askConfirm(msg,ok){modal(`<p style="margin-top:0">${esc(msg)}</p><div style="display:flex;gap:8px"><button class="btn alt" id="mc" style="flex:1">Cancel</button><button class="btn" id="mo" style="flex:1">OK</button></div>`,(o,c)=>{o.querySelector("#mc").onclick=c;o.querySelector("#mo").onclick=()=>{c();ok()}})}
function newYear(){modal(`<b>New audit year</b><label class="f" for="ny">Year (for example 2027-28)</label><input type="text" id="ny" value="${esc(nextYear(S.year))}"><div class="mute" style="margin:8px 0">Copy the "Add to Audit Sheet" selection from ${esc(S.year)} to the new year?</div><button class="btn" id="n1" style="width:100%;margin-bottom:8px">Create – copy selection</button><button class="btn alt" id="n2" style="width:100%;margin-bottom:8px">Create – start with none ticked</button><button class="btn alt" id="n3" style="width:100%">Cancel</button>`,(o,c)=>{
  const go=cp=>{const y=o.querySelector("#ny").value.trim();if(!y){toast("Enter a year");return}if(yearList().includes(y)){toast("That year already exists");return}c();const a={};DEPTS.forEach((_,d)=>{a[d]={};ITEMS.forEach((_,i)=>{a[d][i]=cp?audOn(d,i):false})});switchYear(y,a);toast("Year "+y+" created")};
  o.querySelector("#n1").onclick=()=>go(true);o.querySelector("#n2").onclick=()=>go(false);o.querySelector("#n3").onclick=c})}
function smp(d,i){return ((S.smp[d]||{})[i])||""}
function obh(d){const o=S.ob[d]||{};return{ia:o.ia||"",date:o.date||S.meta.date||"",auditor:o.auditor||S.meta.auditor||"",auditee:o.auditee||"",sec:o.sec||"Academics"}}
function hcv(d,i){return !!((S.hc[d]||{})[i])}
function st(d,i){return (S.d[d]||{})[i]||""}
function noteBox(d,i,v){const t=nt(d,i);
  if(v==="n"||v==="y"||t||opened[d+"_"+i]){const lab=v==="n"?"What is pending in this document?":v==="y"?"Details (what was verified)":"Details",ph=v==="n"?"e.g. Signatures missing, 3 pages incomplete":v==="y"?"e.g. Verified, all pages signed":"Add details";return `<div class="note"><label for="n${i}" ${v==="y"?'style="color:var(--ok)"':""}>${lab}</label><textarea id="n${i}" data-i="${i}" rows="2" placeholder="${ph}">${esc(t)}</textarea></div>`}
  return `<button class="addn" data-add="${i}">+ Add details</button>`}
function itemHtml(i){const n=ITEMS[i],v=st(cur,i),h=hcv(cur,i),info=[FMT[i]?"Format: "+FMT[i]:"",DET[i]].filter(Boolean).join(" · ");
 return `<div class="item"><p><span class="ref">${esc(REF[i])}</span><br>${i+1}. ${esc(n)}</p>${info?`<div class="info">${esc(info)}</div>`:""}<div class="seg" data-i="${i}"><button data-v="y" class="${v==="y"?"y":""}" aria-pressed="${v==="y"}">✓ Ready</button><button data-v="n" class="${v==="n"?"n":""}" aria-pressed="${v==="n"}">✗ Pending</button><button data-v="na" class="${v==="na"?"na":""}" aria-pressed="${v==="na"}">NA</button><button data-hc="1" class="hc ${h?"on":""}" aria-pressed="${h}">${h?"✓ ":""}Hard copy</button></div><div class="seg" style="margin-top:8px"><button data-au="1" class="au ${audOn(cur,i)?"on":""}" aria-pressed="${audOn(cur,i)}">${audOn(cur,i)?"☑":"☐"} Add to Audit Sheet</button></div>${audOn(cur,i)?`<input type="text" class="smp" data-smp="${i}" value="${esc(smp(cur,i))}" placeholder="Sample checked – teacher name" aria-label="Sample teacher name">`:""}${noteBox(cur,i,v)}</div>`}
function groupsHtml(){return `<div class="card">`+ITEMS.map((_,i)=>itemHtml(i)).join("")+`</div>`}
function stats(d){let y=0,na=0;ITEMS.forEach((_,i)=>{const v=st(d,i);if(v==="y")y++;if(v==="na")na++});const t=ITEMS.length-na;let hc=0;ITEMS.forEach((_,i)=>{if(hcv(d,i))hc++});return{y,na,t,hc,pend:t-y,pct:t?Math.round(y/t*100):0}}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function render(){
  const app=document.getElementById("app");
  document.getElementById("title").textContent=view==="home"?"SNM College Maliankara – ISO Check List":DEPTS[cur];
  if(view==="obs"){obsView(app);return}
  if(view==="home"){
    let Y=0,T=0;DEPTS.forEach((_,d)=>{const s=stats(d);Y+=s.y;T+=s.t});
    const P=T?Math.round(Y/T*100):0;
    if(hv==="pend"){pendView(app,Y,T,P);return}
    if(hv==="aud"){audView(app);return}
    app.innerHTML=`<div class="tabs"><button class="on" data-t="dept">Departments</button><button data-t="pend">All pending</button><button data-t="aud">Audit sheets</button></div><div class="card"><label class="f" for="ysel" style="margin-top:0">Audit year</label><div style="display:flex;gap:8px"><select id="ysel">${yearList().map(y=>`<option ${y===S.year?"selected":""}>${esc(y)}</option>`).join("")}</select><button class="btn alt" id="ynew">+ New year</button></div><div class="mute" style="margin-top:6px">Each year keeps its own separate data.</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="yr1" style="flex:1">Year report (Word)</button><button class="btn alt" id="yr2" style="flex:1">Share report</button></div></div><div class="card"><div class="big">${P}%</div><div class="mute" style="margin:4px 0 10px">${Y} of ${T} items ready across ${DEPTS.length} departments</div><div class="bar"><i style="width:${P}%"></i></div></div>

 const RM=DEPTS.map((n,d)=>[n,(S.rem[d]||"").trim()]).filter(r=>r[1]);
 if(RM.length){x+=WP(WR("4. Department remarks",{b:1}),{bf:200});RM.forEach(r=>{x+=WP(WR(r[0]+": ",{b:1})+WR(r[1]))})}
 return x}

function openMenu(){
  const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:8;display:flex;align-items:flex-end;justify-content:center";
  o.innerHTML=`<div class="card menu" style="width:100%;max-width:640px;margin:0;border-radius:14px 14px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))"><div class="meter">Storage used: ${(JSON.stringify(S).length/1024).toFixed(1)} KB of about 5,000 KB · App version 9</div><button class="btn alt" id="a1">Copy pending report</button><button class="btn" id="a6">Download as spreadsheet (CSV)</button><button class="btn alt" id="a8">Copy as table (paste into Sheets / Excel)</button><button class="btn alt" id="a7">Share spreadsheet (WhatsApp, Gmail, Drive)</button><button class="btn alt" id="a2">Back up data (for restore only)</button><label class="btn alt" for="a3">Restore from backup</label><input type="file" id="a3" accept=".json,application/json" hidden><button class="btn warn" id="a4">Clear all ticks</button><button class="btn alt" id="a5">Close</button></div>`;
  document.body.appendChild(o);const close=()=>o.remove();
  o.onclick=e=>{if(e.target===o)close()};
  o.querySelector("#a5").onclick=close;
  o.querySelector("#a1").onclick=async()=>{const t=report();try{await navigator.clipboard.writeText(t);toast("Report copied")}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Report copied")}catch(_){toast("Copy not supported")}a.remove()}close()};
  o.querySelector("#a2").onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="SNMC-ISO-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();toast("Backup downloaded");close()};
  o.querySelector("#a6").onclick=()=>{download(csvName(),csvBuild(),"text/csv;charset=utf-8");toast("Spreadsheet downloaded – check your Downloads folder");close()};
  o.querySelector("#a8").onclick=async()=>{const t=csvBuild(true);try{await navigator.clipboard.writeText(t);toast("Copied – paste into Google Sheets or Excel")}catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");toast("Copied – paste into Google Sheets or Excel")}catch(_){toast("Copy not supported here")}x.remove()}close()};
  o.querySelector("#a7").onclick=async()=>{const f=new File([csvBuild()],csvName(),{type:"text/csv"});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:csvName()})}else toast("Sharing is not supported here. Use Download instead.")}catch(e){}close()};
  o.querySelector("#a3").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.d||j.app!=="snmc")throw 0;S=Object.assign({app:"snmc",meta:{year:"",date:"",auditor:""},d:{},hc:{},smp:{},ob:{},os:{},osi:{},aud:{},rem:{},note:{},year:"2026-27",years:{}},j);save();view="home";render();toast("Backup restored")}catch(_){toast("That file is not a valid backup")}close()};r.readAsText(f)};
  o.querySelector("#a4").onclick=()=>{close();askConfirm("Clear all ticks, notes and remarks? Audit details are kept.",()=>{S.d={};S.hc={};S.smp={};S.ob={};S.os={};S.osi={};S.rem={};S.note={};save();view="home";render();toast("Cleared")})};
}
document.getElementById("menuBtn").onclick=openMenu;
banner();render();
